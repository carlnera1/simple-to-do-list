<!DOCTYPE html>

<html>
    <head>
        <title>To-Do List</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h2>My To-Do List</h2>
        <hr>
        <input type="text" id="task-input" placeholder="Please Enter a Task...">
        <br>
        Total Characters: <h5 id="text-total-characters"></h5>        
        <button id="add-btn">Add</button>
        <ul id="todo-list"></ul>
        <br>
        Total Tasks: <h5 id="text-total-tasks"></h5>
        <!--JS FILE-->
        <script src="to-do-list.js"></script>        
    </body>
</html>
